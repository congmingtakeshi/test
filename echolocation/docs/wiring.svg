<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans',sans-serif" font-size="14">
  <rect width="1100" height="740" fill="#fafaf7"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">エコーロケーション・ヘッドセット 配線図（ステージ0〜2）</text>

  <!-- ESP32 -->
  <rect x="430" y="60" width="220" height="530" rx="10" fill="#e8eef7" stroke="#2c4a7a" stroke-width="2"/>
  <text x="540" y="78" text-anchor="middle" font-weight="bold" fill="#1d3557">ESP32-S3-DevKitC-1</text>
  <text x="540" y="570" text-anchor="middle" font-size="12" fill="#555">給電: USB-C（モバイルバッテリー）</text>

  <!-- wires left: power (red/black), mic (blue), tx (orange), buttons (green) -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="260" y1="100" x2="430" y2="100" stroke="#c0392b"/>
    <line x1="260" y1="130" x2="430" y2="130" stroke="#333"/>
    <line x1="260" y1="190" x2="430" y2="190" stroke="#2471a3"/>
    <line x1="260" y1="220" x2="430" y2="220" stroke="#2471a3"/>
    <line x1="260" y1="330" x2="430" y2="330" stroke="#d35400"/>
    <line x1="260" y1="360" x2="430" y2="360" stroke="#d35400"/>
    <line x1="260" y1="500" x2="430" y2="500" stroke="#1e8449"/>
    <line x1="260" y1="530" x2="430" y2="530" stroke="#1e8449"/>
    <line x1="650" y1="100" x2="820" y2="100" stroke="#c0392b"/>
    <line x1="650" y1="130" x2="820" y2="130" stroke="#333"/>
    <line x1="650" y1="190" x2="820" y2="190" stroke="#7d3c98"/>
    <line x1="650" y1="220" x2="820" y2="220" stroke="#7d3c98"/>
    <line x1="650" y1="250" x2="820" y2="250" stroke="#7d3c98"/>
  </g>

  <!-- ESP pin labels left -->
  <g font-size="13" fill="#1d3557">
    <text x="438" y="95">3V3</text><text x="438" y="125">GND</text>
    <text x="438" y="185">GPIO4  PDM CLK</text><text x="438" y="215">GPIO5  PDM DATA</text>
    <text x="438" y="325">GPIO6  TX_A</text><text x="438" y="355">GPIO7  TX_B</text>
    <text x="438" y="495">GPIO9  BTN +</text><text x="438" y="525">GPIO10 BTN −</text>
  </g>
  <g font-size="13" fill="#1d3557" text-anchor="end">
    <text x="642" y="95">3V3</text><text x="642" y="125">GND</text>
    <text x="642" y="185">GPIO15 BCK</text><text x="642" y="215">GPIO16 LRCK</text><text x="642" y="245">GPIO17 DIN</text>
  </g>

  <!-- Mic block -->
  <rect x="60" y="70" width="200" height="230" rx="8" fill="#fff" stroke="#2471a3" stroke-width="2"/>
  <g font-size="13">
    <text x="250" y="105" text-anchor="end" fill="#c0392b">VDD（各 0.1µF）</text>
    <text x="250" y="135" text-anchor="end" fill="#333">GND</text>
    <text x="250" y="195" text-anchor="end" fill="#2471a3">CLOCK（2個共通）</text>
    <text x="250" y="225" text-anchor="end" fill="#2471a3">DATA（2個共通）</text>
  </g>
  <text x="160" y="254" text-anchor="middle" font-weight="bold">超音波MEMSマイク ×2</text>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#555">SPH0641LU4H-1（左右）</text>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#555">SELECT: 左=GND / 右=3V3</text>

  <!-- TX block -->
  <rect x="60" y="310" width="200" height="110" rx="8" fill="#fff" stroke="#d35400" stroke-width="2"/>
  <text x="250" y="335" text-anchor="end" font-size="13" fill="#d35400">端子1</text>
  <text x="250" y="365" text-anchor="end" font-size="13" fill="#d35400">端子2</text>
  <text x="160" y="392" text-anchor="middle" font-weight="bold">送信器 MA40S4S</text>
  <text x="160" y="410" text-anchor="middle" font-size="12" fill="#555">GPIO6/7を逆相で駆動</text>

  <!-- Buttons -->
  <rect x="60" y="475" width="200" height="105" rx="8" fill="#fff" stroke="#1e8449" stroke-width="2"/>
  <text x="250" y="505" text-anchor="end" font-size="13" fill="#1e8449">＋ → GND</text>
  <text x="250" y="535" text-anchor="end" font-size="13" fill="#1e8449">− → GND</text>
  <text x="160" y="558" text-anchor="middle" font-weight="bold">ボタン ×2（倍率 ＋/−）</text>
  <text x="160" y="574" text-anchor="middle" font-size="12" fill="#555">内部プルアップを使用</text>

  <!-- PCM5102A -->
  <rect x="820" y="70" width="230" height="230" rx="8" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
  <text x="935" y="88" text-anchor="middle" font-weight="bold">PCM5102A モジュール</text>
  <g font-size="13">
    <text x="830" y="105" fill="#c0392b">VIN</text>
    <text x="830" y="135" fill="#333">GND</text>
    <text x="830" y="195" fill="#7d3c98">BCK</text>
    <text x="830" y="225" fill="#7d3c98">LRCK</text>
    <text x="830" y="255" fill="#7d3c98">DIN</text>
  </g>
  <text x="935" y="276" text-anchor="middle" font-size="12" fill="#555">SCK/FLT/DEMP/FMT → GND</text>
  <text x="935" y="292" text-anchor="middle" font-size="12" fill="#555">XSMT → 3V3</text>
  <line x1="935" y1="300" x2="935" y2="360" stroke="#7d3c98" stroke-width="2.5"/>
  <polygon points="925,352 945,352 935,368" fill="#7d3c98"/>
  <rect x="820" y="370" width="230" height="60" rx="8" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
  <text x="935" y="396" text-anchor="middle" font-weight="bold">3.5mm 出力 → イヤホン</text>
  <text x="935" y="416" text-anchor="middle" font-size="12" fill="#555">ステージ3で骨伝導＋アンプに交換</text>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <rect x="60" y="610" width="990" height="90" rx="8" fill="#fff" stroke="#bbb"/>
    <text x="76" y="634" font-weight="bold">注意</text>
    <text x="76" y="656">・マイクは3.3V専用。5Vを絶対に加えない。VINが5V入力のモジュールは、3V3ではなく5Vピンに接続（モジュールの仕様を確認）。</text>
    <text x="76" y="676">・ステージ0では「マイク＋送信器」だけを配線すれば十分（DAC・ボタンは後でよい）。</text>
    <text x="76" y="696">・GPIO0/3/45/46（起動設定）、19/20（USB）、26〜37（フラッシュ/PSRAM）は使っていない。</text>
  </g>
</svg>
